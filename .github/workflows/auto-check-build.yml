name: auto-check-build

on:
  # no pull_request_review trigger: the result cannot change because someone reviewed, and a
  # second run on the same commit only cancels the first through the concurrency group below,
  # which surfaces on the PR as a cancelled check
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["canary", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-check-build:
    name: Audit, Lint, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Audit, Format, Lint, Check-types, Test, and Build
        run: |
          # GHSA-vfj7-8cjw-p6xm: braces has no patched release, and only dev tooling (shadcn, globby) reaches it
          bun audit --audit-level high --ignore GHSA-vfj7-8cjw-p6xm
          bun run format:check
          bun run lint
          bun run check-types
          bun run test
          # Rebuilds the committed twoslash hovers from scratch, so a missing or stale one fails here rather than on a Bun deploy.
          rm -rf web/next/twoslash-cache
          bun run build
          test -z "$(git status --porcelain -- web/next/twoslash-cache)" || { git status --porcelain -- web/next/twoslash-cache; echo "web/next/twoslash-cache is stale: run bun run twoslash:cache and commit it"; exit 1; }
        env:
          # Builds the web as a full deploy has it, with an api.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
